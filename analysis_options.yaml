# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:very_good_analysis/analysis_options.yaml

plugins:
  import_lint: 2.0.0

# Erzwingt die Abhängigkeitsrichtung aus CLAUDE.local.md:
# core -> (nur core) | shared -> core | features -> core, shared
# | pages -> core, shared, features (Sections) | routing -> core, pages
import_lint:
  severity: "error"
  rules:
    # core darf nur core importieren
    core_must_not_depend_on_outer_layers:
      target: "package:zockblock_app/core/**.dart"
      from: "package:zockblock_app/**.dart"
      except:
        - "package:zockblock_app/core/**.dart"
        - "package:zockblock_app/l10n/**.dart"
    # shared darf core + sich selbst importieren
    shared_must_not_depend_on_outer_layers:
      target: "package:zockblock_app/shared/**.dart"
      from: "package:zockblock_app/**.dart"
      except:
        - "package:zockblock_app/core/**.dart"
        - "package:zockblock_app/shared/**.dart"
        - "package:zockblock_app/l10n/**.dart"
    # features dürfen core, shared und andere features importieren, nur
    # pages/ und routing/ sind tabu. Dass ein Feature nur das domain/ eines
    # anderen anfassen darf, ist mit Globs nicht ausdrückbar (bräuchte eine
    # Regel pro Feature) - bewusst nicht erzwungen; falls nötig später über
    # Barrel-Dateien (package:barrel_file_lints).
    features_must_not_depend_on_pages_or_routing:
      target: "package:zockblock_app/features/**.dart"
      from: "package:zockblock_app/**.dart"
      except:
        - "package:zockblock_app/core/**.dart"
        - "package:zockblock_app/shared/**.dart"
        - "package:zockblock_app/features/**.dart"
        - "package:zockblock_app/l10n/**.dart"
    # pages dürfen core, shared und features (Sections) importieren,
    # aber nicht routing
    pages_must_not_depend_on_routing:
      target: "package:zockblock_app/pages/**.dart"
      from: "package:zockblock_app/**.dart"
      except:
        - "package:zockblock_app/core/**.dart"
        - "package:zockblock_app/shared/**.dart"
        - "package:zockblock_app/features/**.dart"
        - "package:zockblock_app/l10n/**.dart"
    # routing darf nur core und pages importieren
    routing_must_only_depend_on_core_and_pages:
      target: "package:zockblock_app/routing/**.dart"
      from: "package:zockblock_app/**.dart"
      except:
        - "package:zockblock_app/core/**.dart"
        - "package:zockblock_app/pages/**.dart"
        - "package:zockblock_app/l10n/**.dart"

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
