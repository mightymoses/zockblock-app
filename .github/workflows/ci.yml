name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Aeltere Laeufe desselben Branches abbrechen, sobald neu gepusht wird.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Analyse, Grenzen, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Liest die Flutter-Version aus .fvmrc - dieselbe Pinnung wie lokal,
      # ohne fvm auf dem Runner installieren zu muessen.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # Generierter Code liegt nicht im Repo (siehe .gitignore) und muss vor
      # allen Checks entstehen - ohne ihn fehlen die "part"-Dateien und
      # "flutter analyze" schlaegt sofort fehl. Bewusst ohne
      # "if: !cancelled()": schlaegt die Generierung fehl, sind alle
      # nachfolgenden Ergebnisse wertlos.
      - name: Code generieren
        run: dart run build_runner build

      - name: Lokalisierung generieren
        run: flutter gen-l10n

      # Ab hier laufen alle Checks durch, auch wenn einer fehlschlaegt:
      # sonst sieht man pro Push nur das erste Problem.
      - name: Format
        if: ${{ !cancelled() }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse
        if: ${{ !cancelled() }}
        run: flutter analyze

      - name: Schichtgrenzen
        if: ${{ !cancelled() }}
        run: dart run import_lint

      - name: Tests
        if: ${{ !cancelled() }}
        run: flutter test
